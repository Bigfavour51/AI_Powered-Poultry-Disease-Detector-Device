; Blue Pill (STM32F103C8T6) test sketch for stm32/pi_link.h. The PC plays the Pi:
;   python tests/pc_pi_simulator.py --port /dev/ttyUSB0
;
; Flash over the FT232R (built-in serial bootloader, no ST-Link needed):
;   1. Adapter jumper on 3.3 V. Adapter TXD -> PA10, adapter RXD <- PA9, GND -- GND.
;   2. BOOT0 jumper to 1 (BOOT1 stays 0), press RESET.
;   3. pio run -t upload        (from this folder)
;   4. BOOT0 back to 0. Move adapter TXD -> PA3 and adapter RXD <- PA2. Press RESET.

[env:bluepill]
platform = ststm32
board = bluepill_f103c8
framework = arduino
upload_protocol = serial
upload_port = /dev/ttyUSB0
