; Poultry Disease Detector - main board (ESP32-S3-DevKitC-1 N16R8: 16 MB flash, 8 MB octal PSRAM)
;
; Flash and debug log both go over the board's "UART" USB port (CH343 bridge, /dev/ttyACM0):
;   `pio run -t upload` resets into the bootloader by itself, no buttons needed.
;   `pio device monitor` for the debug console (115200). Close it before uploading.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 has octal PSRAM: without qio_opi it is not found (or the board boot-loops)
board_build.arduino.memory_type = qio_opi
build_flags = -DBOARD_HAS_PSRAM
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14
